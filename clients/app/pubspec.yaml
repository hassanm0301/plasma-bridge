name: plasma_remote_toolbar_app
description: "Android-first Flutter client for Plasma Remote Toolbar."
publish_to: 'none'
version: 0.3.2+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
